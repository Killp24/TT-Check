name: Probe tt-series.com (one-time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save copies of the site's pages
        run: |
          python3 - <<'PY'
          import os, re, urllib.request, urllib.parse
          os.makedirs("debug", exist_ok=True)
          UA = {"User-Agent": "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Safari/604.1"}
          def get(url, name):
              try:
                  data = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
                  open("debug/" + name, "wb").write(data)
                  print("saved", name, len(data), "bytes from", url)
                  return data.decode("utf-8", "replace")
              except Exception as e:
                  open("debug/" + name + ".error.txt", "w").write(f"{url}\n{e}\n")
                  print("FAILED", url, e)
                  return ""
          base = "https://www.tt-series.com/"
          h2h = get(base + "h2h/", "h2h.html")
          get(base + "player/?player=Petas+Kacper", "player_query.html")
          get(base + "player/petas-kacper/", "player_slug.html")
          cat = get(base + "category/turnieje/", "results_list.html")
          links = re.findall(r'href="(https://www\.tt-series\.com/\d+-result[^"]+)"', cat)
          if links:
              get(links[0], "result_latest.html")
          n = 0
          for src in re.findall(r'<script[^>]+src="([^"]+)"', h2h):
              if "tt-series.com" in src and not re.search(r"jquery|revslider|wp-includes|elementor", src):
                  n += 1
                  get(src, f"h2h_script_{n}.js")
          PY
      - name: Commit the copies
        run: |
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add debug
          git commit -m "Probe copies of tt-series.com pages" || echo "nothing to commit"
          git push

