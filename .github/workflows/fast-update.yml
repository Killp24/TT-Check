name: Fast update (schedule)

on:
  schedule:
    - cron: "20 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update

jobs:
  fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Refresh the schedule
        run: python3 fast_update.py
      - name: Save if changed
        run: |
          git add schedule.txt official.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git commit -m "Refresh schedule"
            git pull --rebase --autostash || true
            git push
          fi
