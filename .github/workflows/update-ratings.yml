name: Update ratings and matches

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect data from tt-series.com
        run: python3 update_data.py
      - name: Save if changed
        run: |
          git add ratings.txt official.txt players.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git config user.name "data-bot"
            git config user.email "data-bot@users.noreply.github.com"
            git commit -m "Update ratings and matches from tt-series.com"
            git pull --rebase
            git push
          fi
