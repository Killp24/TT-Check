name: Update ratings and matches

on:
  schedule:
    # Every 30 minutes. A long run holds the lock; the next one waits instead of stacking.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ratings-sweep
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: Collect data from tt-series.com
        run: python3 update_data.py
      - name: Save if changed
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git config merge.collect.name "union collected results"
          git config merge.collect.driver "python3 blend_driver.py %A %B"
          mkdir -p .git/info
          printf 'official.txt merge=collect\nschedule.txt merge=collect\n' > .git/info/attributes
          git add ratings.txt official.txt players.txt schedule.txt ratings_history.txt h2h.txt
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update ratings and matches from tt-series.com"
            git pull --rebase --autostash origin main
            git push
          fi
